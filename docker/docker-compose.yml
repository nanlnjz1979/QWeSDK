services:
  celery:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: qwesdk:1.0.3
    working_dir: /app
    volumes:
      - type: bind
        source: ./app
        target: /app
        read_only: true
      - type: bind
        source: ../dist
        target: /packages
        read_only: true
      - qwesdk-python:/var/lib/qwesdk/python
    env_file:
      - qwesdk-runtime.env
    environment:
      - PYTHONPATH=/var/lib/qwesdk/python:/app
      - QWESDK_PACKAGE_DIR=/packages
      - QWESDK_INSTALL_TARGET=/var/lib/qwesdk/python
      - CELERY_LOGLEVEL=INFO
      - CELERY_POOL=prefork
      - CELERY_CONCURRENCY=2
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=1g
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 1g
    cpus: 2.0
    init: true

volumes:
  qwesdk-python:
